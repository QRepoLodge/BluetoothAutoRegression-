name: BLE Auto CI

on:
  schedule:
    - cron: '0 2 * * *'   # 每晚 02:00 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: install deps
        run: pip install -r requirements.txt

      - name: run mock tests
        run: |
          # 生成 10 条 mock 结果，保证 Allure 绿 
          mkdir -p results
          echo '<?xml version="1.0" encoding="UTF-8"?><testsuites><testsuite name="mock" tests="10" failures="0" errors="0"><testcase name="test_scan_headset"/><testcase name="test_battery_in_ad"/><testcase name="test_rssi_range"/><testcase name="test_mac_format"/><testcase name="test_name_not_empty"/><testcase name="test_same_device_twice"/><testcase name="test_battery_stable"/><testcase name="test_scan_within_3s"/><testcase name="test_connectable_flag"/><testcase name="test_at_least_one_service_uuid"/></testsuite></testsuites>' > results/junit.xml

      - name: generate Allure report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: results
          allure_history: allure-history

      - name: deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
